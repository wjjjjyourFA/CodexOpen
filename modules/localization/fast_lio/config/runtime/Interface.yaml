fast_lio:
  common:
    lid_topic: /livox/lidar
    imu_topic: /imu/data
  topics:
    odometry: /lio/odom
    state_estimation: /state_estimation
    path: /lio/path
    registered_scan: /registered_scan
  publish:
    path_en: true
    scan_publish_en: true
    dense_publish_en: true
    world_frame: map
    odometry_frame: world
    sensor_frame: sensor
  io:
    output_root: /tmp/codexopen_robot_dog_fast_lio
  transport:
    processing_rate: 20.0
    path_min_distance: 0.1
  queues:
    lidar: 1
    imu: 200000
    output: 100
