[general]
b_generate_map3d = 1
b_generate_color_map = 0

[map]
map_resolution = 0.2
; map_resolution = 0.01
sampling_distance = 2.0
b_use_time_interpolate = 1

[visualize]
b_realtime_show = 1
; 当前帧显示分辨率
realtime_voxel_size=0.5
; 历史地图显示分辨率
realtime_history_voxel_size=1.0
; 每多少帧向 VTK 刷新一次历史地图
realtime_history_batch_frames=10
; 历史显示点数上限，超过后自动加粗体素
realtime_max_history_points=1500000

[calibration]
camera_calib_file_path = /workspaces/CodexOpen/install/common/GreenMengShi193/calib/ar0231_front.ini
; camera_calib_file_path = /workspaces/CodexOpen/install/common/iRobot193/calib/s11a60_front_left.ini
