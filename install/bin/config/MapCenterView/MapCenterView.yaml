init:
  # 先验地图/全局坐标系构建地图：false ; 局部坐标系构建地图：true
  b_use_pose_center: false
  # b_use_pose_center: true

  b_display_roi: true

  # 显示专用地图体素尺寸（米）。原始地图保持不变；0 表示关闭降采样。
  map_display_voxel_size: 1.0
  # ROI 半径和重新裁剪的移动阈值（米）。普通帧继续复用旧 ROI。
  roi_radius: 120.0
  roi_update_dist: 30.0

  b_display_body: true
